apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  labels:
    app: locust-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust-master
  template:
    metadata:
      labels:
        app: locust-master
    spec:
      containers:
      - name: locust-master
        image: locustio/locust:2.15.1
        args:
        - -f
        - /locust/locustfile.py
        - --master
        ports:
        - containerPort: 8089
        - containerPort: 5557
        env:
        - name: TARGET_HOST
          value: "http://frontend-service:80"
        volumeMounts:
        - name: locustfile
          mountPath: /locust
      volumes:
      - name: locustfile
        configMap:
          name: locustfile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  labels:
    app: locust-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: locust-worker
  template:
    metadata:
      labels:
        app: locust-worker
    spec:
      containers:
      - name: locust-worker
        image: locustio/locust:2.15.1
        args:
        - -f
        - /locust/locustfile.py
        - --worker
        - --master-host
        - locust-master
        env:
        - name: TARGET_HOST
          value: "http://frontend-service:80"
        volumeMounts:
        - name: locustfile
          mountPath: /locust
      volumes:
      - name: locustfile
        configMap:
          name: locustfile
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
spec:
  ports:
  - port: 8089
    targetPort: 8089
    name: web
  - port: 5557
    targetPort: 5557
    name: master
  selector:
    app: locust-master
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile
data:
  locustfile.py: |
    from locust import HttpUser, task, between

    class MarkdownUser(HttpUser):
        wait_time = between(1, 3)
        
        @task(3)
        def read_document(self):
            doc_id = "test-doc-1"
            self.client.get(f"/api/documents/{doc_id}")
            
        @task(2)
        def update_document(self):
            doc_id = "test-doc-1"
            self.client.post(f"/api/documents/{doc_id}", 
                           json={"content": "# Test Document\n\nThis is a test document."})
            
        @task(1)
        def list_documents(self):
            self.client.get("/api/documents") 