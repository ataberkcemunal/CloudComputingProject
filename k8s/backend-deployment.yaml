apiVersion: apps/v1
kind: Deployment
metadata:
  name: markdown-backend
  labels:
    app: markdown-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: markdown-backend
  template:
    metadata:
      labels:
        app: markdown-backend
    spec:
      containers:
      - name: backend
        image: gcr.io/markdown-notebook-460514/markdown-backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: uri
        - name: FRONTEND_URL
          value: "http://markdown-frontend-service"
---
apiVersion: v1
kind: Service
metadata:
  name: markdown-backend-service
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
  selector:
    app: markdown-backend
