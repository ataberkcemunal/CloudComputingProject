apiVersion: apps/v1
kind: Deployment
metadata:
  name: markdown-frontend
  labels:
    app: markdown-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: markdown-frontend
  template:
    metadata:
      labels:
        app: markdown-frontend
    spec:
      containers:
      - name: frontend
        image: gcr.io/markdown-notebook-460514/markdown-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_BACKEND_URL
          value: "http://markdown-backend-service:3001"
---
apiVersion: v1
kind: Service
metadata:
  name: markdown-frontend-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: markdown-frontend
